<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Senha - LWN Control</title>
    <link rel="stylesheet" href="almoxarife.css">
    <link rel="icon" href="/assets/app-icon-192.png" type="image/png">
    <style>
        html, body { min-height: 100%; }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background:
                radial-gradient(900px 520px at 12% -10%, var(--primary-glow), transparent 60%),
                radial-gradient(760px 480px at 105% 110%, var(--primary-glow), transparent 62%),
                var(--bg-main);
            color: var(--text-main);
            margin: 0;
            padding: 1.25rem;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            transition: background 0.25s ease, color 0.25s ease;
        }

        /* ---------- Botão de modo noturno ---------- */
        .theme-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            box-shadow: var(--card-shadow);
            color: var(--text-secondary);
            cursor: pointer;
            transition: transform 0.18s ease, border-color 0.18s ease, color 0.18s ease;
            z-index: 20;
        }
        .theme-toggle:hover {
            transform: scale(1.06);
            border-color: var(--primary);
            color: var(--primary);
        }
        .theme-toggle:active { transform: scale(0.94); }
        .theme-toggle svg {
            width: 18px;
            height: 18px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* ---------- Card ---------- */
        .reset-card {
            max-width: 430px;
            width: 100%;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 1rem;
            padding: 2rem 1.85rem;
            box-shadow: var(--card-shadow);
        }
        .logo {
            text-align: center;
            margin-bottom: 1.35rem;
        }
        .logo img {
            height: 42px;
            width: auto;
            object-fit: contain;
        }
        .logo .logo-escuro { display: none; }
        body.dark-mode .logo .logo-claro { display: none; }
        body.dark-mode .logo .logo-escuro { display: inline-block; }

        .reset-card h1 {
            font-size: 1.35rem;
            font-weight: 800;
            letter-spacing: -0.01em;
            color: var(--text-main);
            text-align: center;
            margin: 0 0 0.35rem;
        }
        .reset-card .subtitle {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.85rem;
            line-height: 1.5;
            margin: 0 0 1.6rem;
        }

        .form-group { margin-bottom: 1rem; }
        .form-label {
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--text-muted);
            display: block;
            margin-bottom: 0.35rem;
        }
        .form-input {
            width: 100%;
            box-sizing: border-box;
            padding: 0.65rem 0.9rem;
            border-radius: 0.55rem;
            border: 2px solid var(--border-color);
            background: var(--bg-surface);
            color: var(--text-main);
            font-size: 0.92rem;
            font-family: inherit;
            transition: border-color 0.18s ease, box-shadow 0.18s ease;
            outline: none;
        }
        .form-input::placeholder { color: var(--text-dim); }
        .form-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-glow);
        }

        .btn {
            width: 100%;
            padding: 0.7rem;
            border-radius: 0.55rem;
            border: none;
            font-size: 0.9rem;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.18s ease;
        }
        .btn-primary {
            background: var(--primary);
            color: var(--primary-foreground);
            box-shadow: 0 4px 14px var(--primary-glow);
            margin-top: 0.35rem;
        }
        .btn-primary:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
            box-shadow: 0 6px 20px var(--primary-glow);
        }
        .btn-primary:disabled {
            opacity: 0.55;
            cursor: not-allowed;
            transform: none;
        }
        .btn-outline {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            margin-top: 0.6rem;
        }
        .btn-outline:hover {
            background: var(--glass-bg);
            border-color: var(--border-active);
            color: var(--text-main);
        }

        .codigo-timer {
            text-align: center;
            font-size: 0.78rem;
            color: var(--text-muted);
            margin: 0.35rem 0 1rem;
            padding: 0.45rem;
            border: 1px dashed var(--border-color);
            border-radius: 0.5rem;
        }
        .codigo-timer span {
            font-weight: 800;
            color: var(--primary);
        }

        .mensagem {
            padding: 0.7rem 0.95rem;
            border-radius: 0.55rem;
            margin-bottom: 1rem;
            font-size: 0.83rem;
            line-height: 1.45;
            display: none;
            border: 1px solid transparent;
        }
        .mensagem.sucesso {
            display: block;
            background: var(--success-light);
            color: var(--success);
            border-color: var(--success);
        }
        .mensagem.erro {
            display: block;
            background: var(--danger-light);
            color: var(--danger);
            border-color: var(--danger);
        }
        .mensagem.info {
            display: block;
            background: var(--info-light);
            color: var(--info);
            border-color: var(--info);
        }

        .requisitos {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 0.5rem;
            padding: 0.6rem 0.75rem;
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: 0.5rem;
        }

        @media (max-width: 480px) {
            .reset-card { padding: 1.6rem 1.25rem; border-radius: 0.85rem; }
            .theme-toggle { top: 14px; right: 14px; width: 40px; height: 40px; }
        }
    </style>
</head>
<body>
    <button class="theme-toggle" id="themeToggle" type="button" aria-label="Alternar modo noturno" title="Alternar modo noturno">
        <svg id="themeIcon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>

    <div class="reset-card">
        <div class="logo">
            <img class="logo-claro" src="../assets/LogoLWN.webp" alt="LWN Engenharia" onerror="this.style.display='none'">
            <img class="logo-escuro" src="../assets/LogoLWNWhite.webp" alt="LWN Engenharia" onerror="this.style.display='none'">
        </div>

        <h1 id="titulo">Esqueceu sua senha?</h1>
        <p class="subtitle" id="subtitulo">Informe seu e-mail ou CPF para receber um código.</p>

        <div id="mensagem" class="mensagem"></div>

        <!-- PASSO 1 — QUEM É VOCÊ
             O código sempre vai para o E-MAIL CADASTRADO, mesmo quando a
             pessoa se identifica pelo CPF: informar o CPF não permite
             escolher para onde o código é enviado. -->
        <form id="passo-identificar" onsubmit="pedirCodigo(event)">
            <div class="form-group">
                <label class="form-label" for="identificador">E-mail ou CPF</label>
                <input type="text" id="identificador" class="form-input" required
                       placeholder="email@lwnengenharia.com.br ou 12345678900"
                       autocomplete="username" autocapitalize="off" spellcheck="false">
            </div>

            <div class="requisitos">
                O código de 6 dígitos vai para o e-mail cadastrado no seu perfil.
            </div>

            <button type="submit" class="btn btn-primary" id="btn-pedir">Enviar código</button>
        </form>

        <!-- PASSO 2 — O CÓDIGO E A SENHA NOVA -->
        <form id="passo-redefinir" style="display:none;" onsubmit="redefinirSenha(event)">
            <div class="form-group">
                <label class="form-label" for="codigo">Código de 6 dígitos</label>
                <input type="text" id="codigo" class="form-input" placeholder="Ex: 123456" required
                       maxlength="6" inputmode="numeric" autocomplete="one-time-code"
                       oninput="this.value = this.value.replace(/\D/g, '')">
            </div>

            <div class="form-group">
                <label class="form-label" for="nova_senha">Nova Senha</label>
                <input type="password" id="nova_senha" class="form-input" placeholder="Mínimo 6 caracteres" required minlength="6" autocomplete="new-password">
            </div>

            <div class="form-group">
                <label class="form-label" for="confirmar_senha">Confirmar Nova Senha</label>
                <input type="password" id="confirmar_senha" class="form-input" placeholder="Digite a senha novamente" required minlength="6" autocomplete="new-password">
            </div>

            <div class="requisitos">
                A senha deve ter pelo menos 6 caracteres.
            </div>

            <button type="submit" class="btn btn-primary" id="btn-redefinir">Redefinir Senha</button>
            <button type="button" class="btn btn-outline" onclick="voltarAoPasso1()" style="margin-top:0.6rem;">Não recebi o código</button>
        </form>

        <button class="btn btn-outline" type="button" onclick="voltarPaginaAnterior()">Voltar ao login</button>
    </div>

    <script>
        // ============================================================
        // TEMA (MODO NOTURNO) - compartilhado com o restante do sistema
        // ============================================================
        (function () {
            const moonPath = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';
            const sunPath = '<circle cx="12" cy="12" r="4.2"/><line x1="12" y1="2.5" x2="12" y2="4.7"/><line x1="12" y1="19.3" x2="12" y2="21.5"/><line x1="4.2" y1="4.2" x2="5.7" y2="5.7"/><line x1="18.3" y1="18.3" x2="19.8" y2="19.8"/><line x1="2.5" y1="12" x2="4.7" y2="12"/><line x1="19.3" y1="12" x2="21.5" y2="12"/><line x1="4.2" y1="19.8" x2="5.7" y2="18.3"/><line x1="18.3" y1="5.7" x2="19.8" y2="4.2"/>';

            function aplicarTema(tema) {
                const escuro = tema === 'dark';
                document.body.classList.toggle('dark-mode', escuro);
                const icone = document.getElementById('themeIcon');
                if (icone) icone.innerHTML = escuro ? sunPath : moonPath;
            }

            let salvo = null;
            try { salvo = localStorage.getItem('lwn_theme'); } catch (e) {}
            const inicial = salvo || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            aplicarTema(inicial);

            document.getElementById('themeToggle').addEventListener('click', function () {
                const proximo = document.body.classList.contains('dark-mode') ? 'light' : 'dark';
                aplicarTema(proximo);
                try { localStorage.setItem('lwn_theme', proximo); } catch (e) {}
            });
        })();

        // ============================================================
        // CONFIGURAÇÃO DA API
        // ============================================================
        const API_URL = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')
            ? 'http://localhost:3000/api'
            : `https://${window.location.hostname}/api`;

        // ============================================================
        // RECUPERAÇÃO DE SENHA — EM DOIS PASSOS
        //
        //   1. a pessoa informa o e-mail OU o CPF, e o servidor manda um
        //      código de 6 dígitos para o e-mail CADASTRADO dela;
        //   2. ela volta aqui com o código e escolhe a senha nova.
        //
        // O CPF serve só para achar o cadastro: o código vai sempre para o
        // e-mail do perfil, nunca para um endereço informado na hora.
        //
        // O identificador do passo 1 é guardado em memória e reenviado no
        // passo 2 — o servidor precisa dele para saber de quem é o código, e
        // pedir de novo à pessoa seria repetição sem motivo.
        // ============================================================
        let identificadorInformado = '';

        async function pedirCodigo(event) {
            event.preventDefault();

            const identificador = document.getElementById('identificador').value.trim();
            const btn = document.getElementById('btn-pedir');

            if (!identificador) {
                mostrarMensagem("Informe o seu e-mail ou CPF.", "erro");
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Enviando...';
            document.getElementById('mensagem').style.display = 'none';

            try {
                const resposta = await fetch(`${API_URL}/senha/solicitar-codigo`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json", "Accept": "application/json" },
                    body: JSON.stringify({ identificador })
                });
                const resultado = await resposta.json();

                if (!resposta.ok) {
                    // "Sem e-mail cadastrado" é o único caso em que a pessoa
                    // precisa procurar alguém — e o texto já diz isso.
                    throw new Error(resultado.erro || "Não foi possível enviar o código.");
                }

                identificadorInformado = identificador;
                irParaPasso2(resultado.email_mascarado, resultado.expira_em_minutos);

            } catch (erro) {
                console.error("Erro ao pedir o código:", erro);
                mostrarMensagem(erro.message, "erro");
                btn.disabled = false;
                btn.textContent = 'Enviar código';
            }
        }

        function irParaPasso2(emailMascarado, minutos) {
            document.getElementById('passo-identificar').style.display = 'none';
            document.getElementById('passo-redefinir').style.display = 'block';
            document.getElementById('titulo').textContent = 'Digite o código';
            document.getElementById('subtitulo').textContent = emailMascarado
                ? `Enviamos um código para ${emailMascarado}.`
                : 'Se este cadastro existir, o código foi enviado para o e-mail cadastrado.';

            mostrarMensagem(
                `Confira a sua caixa de entrada${minutos ? ` — o código vale por ${minutos} minutos` : ''}. `
                + 'Se não estiver lá, veja no lixo eletrônico.',
                'sucesso'
            );
            setTimeout(() => document.getElementById('codigo').focus(), 80);
        }

        function voltarAoPasso1() {
            document.getElementById('passo-redefinir').style.display = 'none';
            document.getElementById('passo-identificar').style.display = 'block';
            document.getElementById('titulo').textContent = 'Esqueceu sua senha?';
            document.getElementById('subtitulo').textContent = 'Informe seu e-mail ou CPF para receber um código.';
            document.getElementById('mensagem').style.display = 'none';

            const btn = document.getElementById('btn-pedir');
            btn.disabled = false;
            btn.textContent = 'Enviar código';
            document.getElementById('codigo').value = '';
            setTimeout(() => document.getElementById('identificador').focus(), 80);
        }

        // ============================================================
        // PASSO 2 — O CÓDIGO E A SENHA NOVA
        // ============================================================
        async function redefinirSenha(event) {
            event.preventDefault();

            const codigo = document.getElementById('codigo').value.trim();
            const novaSenha = document.getElementById('nova_senha').value;
            const confirmarSenha = document.getElementById('confirmar_senha').value;
            const btn = document.getElementById('btn-redefinir');

            if (!codigo || codigo.length !== 6) {
                mostrarMensagem("Digite o código de 6 dígitos que chegou no seu e-mail.", "erro");
                return;
            }
            if (!novaSenha || novaSenha.length < 6) {
                mostrarMensagem("A senha deve ter pelo menos 6 caracteres.", "erro");
                return;
            }
            if (novaSenha !== confirmarSenha) {
                mostrarMensagem("As senhas não coincidem.", "erro");
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Processando...';
            document.getElementById('mensagem').style.display = 'none';

            try {
                const resposta = await fetch(`${API_URL}/senha/redefinir`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json", "Accept": "application/json" },
                    body: JSON.stringify({
                        identificador: identificadorInformado,
                        codigo: codigo,
                        nova_senha: novaSenha
                    })
                });
                const resultado = await resposta.json();
                if (!resposta.ok) throw new Error(resultado.erro || "Erro ao redefinir senha");

                mostrarMensagem(resultado.mensagem || "Senha redefinida com sucesso!", "sucesso");
                ['codigo', 'nova_senha', 'confirmar_senha'].forEach(id => {
                    document.getElementById(id).value = '';
                });
                btn.textContent = 'Concluído';

                setTimeout(() => { window.location.href = '../index.html'; }, 2500);

            } catch (erro) {
                console.error("Erro ao redefinir senha:", erro);
                mostrarMensagem(erro.message, "erro");
                btn.disabled = false;
                btn.textContent = 'Redefinir Senha';
            }
        }

        // ============================================================
        // EXIBIR MENSAGENS
        // ============================================================
        function mostrarMensagem(texto, tipo) {
            const mensagem = document.getElementById('mensagem');
            mensagem.textContent = texto;
            mensagem.className = 'mensagem ' + tipo;
            mensagem.style.display = 'block';
        }

        // ============================================================
        // VOLTAR
        // ============================================================
        function voltarPaginaAnterior() {
            window.location.href = '../index.html';
        }

        // A tela de login manda o e-mail/CPF já digitado — quem chegou aqui de
        // lá não precisa digitar duas vezes.
        (function () {
            const params = new URLSearchParams(window.location.search);
            const vindo = params.get('email') || params.get('identificador');
            if (vindo) document.getElementById('identificador').value = vindo;
            setTimeout(() => document.getElementById('identificador').focus(), 100);
        })();
    </script>
</body>
</html>
