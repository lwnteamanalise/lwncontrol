<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redefinir Senha - LWN Control</title>
    <link rel="stylesheet" href="almoxarife.css">
    <link rel="icon" href="/assets/app-icon-192.png" type="image/png">
    <style>
        html, body { min-height: 100%; }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background:
                radial-gradient(900px 520px at 12% -10%, var(--primary-glow), transparent 60%),
                radial-gradient(760px 480px at 105% 110%, var(--primary-glow), transparent 62%),
                var(--bg-main);
            color: var(--text-main);
            margin: 0;
            padding: 1.25rem;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            transition: background 0.25s ease, color 0.25s ease;
        }

        /* ---------- Botão de modo noturno ---------- */
        .theme-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            box-shadow: var(--card-shadow);
            color: var(--text-secondary);
            cursor: pointer;
            transition: transform 0.18s ease, border-color 0.18s ease, color 0.18s ease;
            z-index: 20;
        }
        .theme-toggle:hover {
            transform: scale(1.06);
            border-color: var(--primary);
            color: var(--primary);
        }
        .theme-toggle:active { transform: scale(0.94); }
        .theme-toggle svg {
            width: 18px;
            height: 18px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* ---------- Card ---------- */
        .reset-card {
            max-width: 430px;
            width: 100%;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 1rem;
            padding: 2rem 1.85rem;
            box-shadow: var(--card-shadow);
        }
        .logo {
            text-align: center;
            margin-bottom: 1.35rem;
        }
        .logo img {
            height: 42px;
            width: auto;
            object-fit: contain;
        }
        .logo .logo-escuro { display: none; }
        body.dark-mode .logo .logo-claro { display: none; }
        body.dark-mode .logo .logo-escuro { display: inline-block; }

        .reset-card h1 {
            font-size: 1.35rem;
            font-weight: 800;
            letter-spacing: -0.01em;
            color: var(--text-main);
            text-align: center;
            margin: 0 0 0.35rem;
        }
        .reset-card .subtitle {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.85rem;
            line-height: 1.5;
            margin: 0 0 1.6rem;
        }

        .form-group { margin-bottom: 1rem; }
        .form-label {
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--text-muted);
            display: block;
            margin-bottom: 0.35rem;
        }
        .form-input {
            width: 100%;
            box-sizing: border-box;
            padding: 0.65rem 0.9rem;
            border-radius: 0.55rem;
            border: 2px solid var(--border-color);
            background: var(--bg-surface);
            color: var(--text-main);
            font-size: 0.92rem;
            font-family: inherit;
            transition: border-color 0.18s ease, box-shadow 0.18s ease;
            outline: none;
        }
        .form-input::placeholder { color: var(--text-dim); }
        .form-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-glow);
        }

        .btn {
            width: 100%;
            padding: 0.7rem;
            border-radius: 0.55rem;
            border: none;
            font-size: 0.9rem;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.18s ease;
        }
        .btn-primary {
            background: var(--primary);
            color: var(--primary-foreground);
            box-shadow: 0 4px 14px var(--primary-glow);
            margin-top: 0.35rem;
        }
        .btn-primary:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
            box-shadow: 0 6px 20px var(--primary-glow);
        }
        .btn-primary:disabled {
            opacity: 0.55;
            cursor: not-allowed;
            transform: none;
        }
        .btn-outline {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            margin-top: 0.6rem;
        }
        .btn-outline:hover {
            background: var(--glass-bg);
            border-color: var(--border-active);
            color: var(--text-main);
        }

        .codigo-timer {
            text-align: center;
            font-size: 0.78rem;
            color: var(--text-muted);
            margin: 0.35rem 0 1rem;
            padding: 0.45rem;
            border: 1px dashed var(--border-color);
            border-radius: 0.5rem;
        }
        .codigo-timer span {
            font-weight: 800;
            color: var(--primary);
        }

        .mensagem {
            padding: 0.7rem 0.95rem;
            border-radius: 0.55rem;
            margin-bottom: 1rem;
            font-size: 0.83rem;
            line-height: 1.45;
            display: none;
            border: 1px solid transparent;
        }
        .mensagem.sucesso {
            display: block;
            background: var(--success-light);
            color: var(--success);
            border-color: var(--success);
        }
        .mensagem.erro {
            display: block;
            background: var(--danger-light);
            color: var(--danger);
            border-color: var(--danger);
        }
        .mensagem.info {
            display: block;
            background: var(--info-light);
            color: var(--info);
            border-color: var(--info);
        }

        .requisitos {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 0.5rem;
            padding: 0.6rem 0.75rem;
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: 0.5rem;
        }

        @media (max-width: 480px) {
            .reset-card { padding: 1.6rem 1.25rem; border-radius: 0.85rem; }
            .theme-toggle { top: 14px; right: 14px; width: 40px; height: 40px; }
        }
    </style>
</head>
<body>
    <button class="theme-toggle" id="themeToggle" type="button" aria-label="Alternar modo noturno" title="Alternar modo noturno">
        <svg id="themeIcon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>

    <div class="reset-card">
        <div class="logo">
            <img class="logo-claro" src="../assets/LogoLWN.webp" alt="LWN Engenharia" onerror="this.style.display='none'">
            <img class="logo-escuro" src="../assets/LogoLWNWhite.webp" alt="LWN Engenharia" onerror="this.style.display='none'">
        </div>

        <h1>Redefinir Senha</h1>
        <p class="subtitle">Informe seu CPF e o código de 6 dígitos recebido</p>

        <div id="mensagem" class="mensagem"></div>

        <form id="form-redefinir" onsubmit="redefinirSenha(event)">
            <div class="form-group">
                <label class="form-label" for="cpf">CPF (somente números)</label>
                <input type="text" id="cpf" class="form-input" placeholder="Ex: 12345678900" required maxlength="11" inputmode="numeric" oninput="this.value = this.value.replace(/\D/g, '')">
            </div>

            <div class="form-group">
                <label class="form-label" for="codigo">Código de 6 dígitos</label>
                <input type="text" id="codigo" class="form-input" placeholder="Ex: 123456" required maxlength="6" inputmode="numeric" oninput="this.value = this.value.replace(/\D/g, '')">
            </div>

            <div class="form-group">
                <label class="form-label" for="nova_senha">Nova Senha</label>
                <input type="password" id="nova_senha" class="form-input" placeholder="Mínimo 6 caracteres" required minlength="6">
            </div>

            <div class="form-group">
                <label class="form-label" for="confirmar_senha">Confirmar Nova Senha</label>
                <input type="password" id="confirmar_senha" class="form-input" placeholder="Digite a senha novamente" required minlength="6">
            </div>

            <div class="requisitos">
                A senha deve ter pelo menos 6 caracteres.
            </div>

            <button type="submit" class="btn btn-primary" id="btn-redefinir">Redefinir Senha</button>
        </form>

        <button class="btn btn-outline" type="button" onclick="voltarPaginaAnterior()">Voltar</button>
    </div>

    <script>
        // ============================================================
        // TEMA (MODO NOTURNO) - compartilhado com o restante do sistema
        // ============================================================
        (function () {
            const moonPath = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';
            const sunPath = '<circle cx="12" cy="12" r="4.2"/><line x1="12" y1="2.5" x2="12" y2="4.7"/><line x1="12" y1="19.3" x2="12" y2="21.5"/><line x1="4.2" y1="4.2" x2="5.7" y2="5.7"/><line x1="18.3" y1="18.3" x2="19.8" y2="19.8"/><line x1="2.5" y1="12" x2="4.7" y2="12"/><line x1="19.3" y1="12" x2="21.5" y2="12"/><line x1="4.2" y1="19.8" x2="5.7" y2="18.3"/><line x1="18.3" y1="5.7" x2="19.8" y2="4.2"/>';

            function aplicarTema(tema) {
                const escuro = tema === 'dark';
                document.body.classList.toggle('dark-mode', escuro);
                const icone = document.getElementById('themeIcon');
                if (icone) icone.innerHTML = escuro ? sunPath : moonPath;
            }

            let salvo = null;
            try { salvo = localStorage.getItem('lwn_theme'); } catch (e) {}
            const inicial = salvo || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            aplicarTema(inicial);

            document.getElementById('themeToggle').addEventListener('click', function () {
                const proximo = document.body.classList.contains('dark-mode') ? 'light' : 'dark';
                aplicarTema(proximo);
                try { localStorage.setItem('lwn_theme', proximo); } catch (e) {}
            });
        })();

        // ============================================================
        // CONFIGURAÇÃO DA API
        // ============================================================
        const API_URL = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')
            ? 'http://localhost:3000/api'
            : `https://${window.location.hostname}/api`;

        // ============================================================
        // FUNÇÃO PRINCIPAL DE REDEFINIÇÃO DE SENHA
        // ============================================================
        async function redefinirSenha(event) {
            event.preventDefault();

            const cpf = document.getElementById('cpf').value.trim();
            const codigo = document.getElementById('codigo').value.trim();
            const novaSenha = document.getElementById('nova_senha').value;
            const confirmarSenha = document.getElementById('confirmar_senha').value;

            const mensagem = document.getElementById('mensagem');
            const btn = document.getElementById('btn-redefinir');

            // Validações
            if (!cpf || cpf.length !== 11) {
                mostrarMensagem("Digite um CPF válido com 11 dígitos.", "erro");
                return;
            }

            if (!codigo || codigo.length !== 6) {
                mostrarMensagem("Digite o código de 6 dígitos.", "erro");
                return;
            }

            if (!novaSenha || novaSenha.length < 6) {
                mostrarMensagem("A senha deve ter pelo menos 6 caracteres.", "erro");
                return;
            }

            if (novaSenha !== confirmarSenha) {
                mostrarMensagem("As senhas não coincidem.", "erro");
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Processando...';
            mensagem.style.display = 'none';

            try {
                const dados = {
                    cpf: cpf,
                    codigo: codigo,
                    nova_senha: novaSenha
                };

                const resposta = await fetch(`${API_URL}/usuarios/validar-codigo`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Accept": "application/json"
                    },
                    body: JSON.stringify(dados)
                });

                const resultado = await resposta.json();

                if (!resposta.ok) {
                    throw new Error(resultado.erro || "Erro ao redefinir senha");
                }

                mostrarMensagem(resultado.mensagem || "Senha redefinida com sucesso!", "sucesso");

                document.getElementById('cpf').value = '';
                document.getElementById('codigo').value = '';
                document.getElementById('nova_senha').value = '';
                document.getElementById('confirmar_senha').value = '';

                btn.textContent = 'Concluído';

                setTimeout(() => {
                    window.location.href = '../index.html';
                }, 3000);

            } catch (erro) {
                console.error("Erro ao redefinir senha:", erro);
                mostrarMensagem(erro.message, "erro");
                btn.disabled = false;
                btn.textContent = 'Redefinir Senha';
            }
        }

        // ============================================================
        // EXIBIR MENSAGENS
        // ============================================================
        function mostrarMensagem(texto, tipo) {
            const mensagem = document.getElementById('mensagem');
            mensagem.textContent = texto;
            mensagem.className = 'mensagem ' + tipo;
            mensagem.style.display = 'block';
        }

        // ============================================================
        // VOLTAR
        // ============================================================
        function voltarPaginaAnterior() {
            window.location.href = '../index.html';
        }
    </script>
</body>
</html>
